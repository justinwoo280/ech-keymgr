# golangci-lint v2 configuration for ech-keymgr.
# Schema reference: https://golangci-lint.run/usage/configuration/
#
# Run locally:
#   golangci-lint run --build-tags=all ./...

version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - all

linters:
  default: none
  enable:
    # Default-ish core checks.
    - errcheck
    - govet
    - ineffassign
    - staticcheck       # subsumes gosimple in v2
    - unused
    # Extras that pay for themselves on this project.
    - bodyclose
    - contextcheck
    - errorlint
    - misspell
    - nakedret
    - nolintlint
    - revive
    - unconvert
    - unparam
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable:
        - shadow
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests can be a bit looser.
      - path: _test\.go
        linters:
          - errcheck
          - unparam
      # cobra command files share boilerplate by design.
      - path: cmd/ech-keymgr/cmd_.*\.go
        linters:
          - dupl

formatters:
  enable:
    - gofmt
    - goimports
