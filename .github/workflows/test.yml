name: test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: ${{ matrix.os }} / go${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Pinned to 1.25.x because go.mod requires `go 1.25.0` (needed
        # for transitive dependency compatibility) and we pin a 1.25.7+
        # toolchain to pick up GO-2026-4337/4340 crypto/tls fixes.
        go: ["1.25.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Show Go env
        run: go env

      - name: Verify go.mod is tidy
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build (default tags)
        run: go build ./...

      - name: Build (all providers)
        run: go build -tags=all ./...

      - name: Test (race)
        # We use -cover (statement-level summary) instead of
        # -coverprofile=... because the latter triggers
        # `go: no such tool "covdata"` on packages with no _test.go
        # files (here: pkg/dns, providers, providers/community,
        # cmd/ech-keymgr). Add a unit test to those packages later
        # if a written profile is needed.
        run: go test -tags=all -race -cover ./...
